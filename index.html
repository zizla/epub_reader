<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>판면 EPUB 리더</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@800&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
/* Layout: 화면 전체가 무대, 가운데 한 쪽/두 쪽 판면. 위·아래 바는 판면 위에 떴다 사라진다 */
:root {
  --bg: #e8eae9;
  --surface: #ffffff;
  --ink: #181c1b;
  --muted: #6a7470;
  --line: #d8dddb;
  --accent: #2856a8;
  --accent-soft: #e6ecf7;
  --r-bg: #fdfdfb;
  --r-ink: #1a1f1e;
  --shadow: 0 1px 2px rgb(20 30 25 / .08), 0 14px 44px rgb(20 30 25 / .13);

  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-display: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --fallback-font: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0f0f;
    --surface: #191c1c;
    --ink: #e6eae8;
    --muted: #949e9a;
    --line: #2c3231;
    --accent: #8fb0ee;
    --accent-soft: #1f2a3d;
    --r-bg: #1b1e1e;
    --r-ink: #d9dfdc;
    --shadow: 0 1px 2px rgb(0 0 0 / .5), 0 14px 44px rgb(0 0 0 / .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0f0f;
  --surface: #191c1c;
  --ink: #e6eae8;
  --muted: #949e9a;
  --line: #2c3231;
  --accent: #8fb0ee;
  --accent-soft: #1f2a3d;
  --r-bg: #1b1e1e;
  --r-ink: #d9dfdc;
  --shadow: 0 1px 2px rgb(0 0 0 / .5), 0 14px 44px rgb(0 0 0 / .55);
}
/* 사용자가 고른 테마는 시스템 설정보다 우선해 화면 전체에 적용 */
body[data-read="paper"] {
  color-scheme: light;
  --bg: #e8eae9; --surface: #ffffff; --ink: #181c1b; --muted: #6a7470; --line: #d8dddb;
  --accent: #2856a8; --accent-soft: #e6ecf7;
  --r-bg: #fdfdfb; --r-ink: #1a1f1e;
  --shadow: 0 1px 2px rgb(20 30 25 / .08), 0 14px 44px rgb(20 30 25 / .13);
}
body[data-read="sepia"] {
  color-scheme: light;
  --bg: #e4d9c4; --surface: #f7f0e2; --ink: #3a2f23; --muted: #7d6c57; --line: #d9cbb0;
  --accent: #8a531b; --accent-soft: #efe0c6;
  --r-bg: #f4ebda; --r-ink: #3a2f23;
  --shadow: 0 1px 2px rgb(70 50 20 / .10), 0 14px 44px rgb(70 50 20 / .16);
}
body[data-read="night"] {
  color-scheme: dark;
  --bg: #0d0f0f; --surface: #191c1c; --ink: #e6eae8; --muted: #949e9a; --line: #2c3231;
  --accent: #8fb0ee; --accent-soft: #1f2a3d;
  --r-bg: #1a1d1c; --r-ink: #d4dad7;
  --shadow: 0 1px 2px rgb(0 0 0 / .5), 0 14px 44px rgb(0 0 0 / .55);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body.reading { overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 첫 화면 ---------- */
.landing {
  min-height: 100%;
  display: grid; place-items: center;
  padding-block: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.landing .inner { display: grid; justify-items: center; gap: 18px; text-align: center; }
.mini { display: flex; width: 150px; height: 104px; position: relative; filter: drop-shadow(0 10px 22px rgb(20 30 25 / .14)); margin-bottom: 6px; }
.mini i {
  flex: 1; background: var(--r-bg); position: relative;
  background-image: repeating-linear-gradient(to bottom, transparent 0 9px, color-mix(in srgb, var(--r-ink) 13%, transparent) 9px 11px);
  background-size: 54px 66px; background-repeat: no-repeat; background-position: center 16px;
}
.mini i span { position: absolute; bottom: 6px; font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mini i:first-child span { left: 9px; }
.mini i:last-child span { right: 9px; }
.mini::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 22px; transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, rgb(0 0 0 / .10) 50%, transparent);
}
.mark { font-family: var(--font-display); font-weight: 800; font-size: 44px; letter-spacing: .06em; margin: 0; line-height: 1.1; }
.tag { margin: -6px 0 10px; color: var(--muted); font-size: 15px; }
.cta {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: var(--surface);
  padding: 13px 30px; border-radius: 999px; font-weight: 600; font-size: 15px; cursor: pointer;
}
.cta:hover { filter: brightness(1.07); }
.link { border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 4px 8px; }
.link:hover { color: var(--ink); }
.fine { margin: 18px 0 0; color: var(--muted); font-size: 12px; }

/* ---------- 무대 ---------- */
.stage {
  position: fixed;
  top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
  left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
  display: flex; overflow: hidden; touch-action: none;
}
.stage.edge { background: var(--r-bg); }
.stage.zoomed { overflow: auto; cursor: grab; user-select: none; -webkit-user-select: none; }
.zoomwrap { margin: auto; flex: none; position: relative; }
.spread { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: flex; align-items: center; }
.spread.paper { background: var(--r-bg); box-shadow: var(--shadow); border-radius: 2px; }
.stage.edge .spread.paper { box-shadow: none; border-radius: 0; }
#flow { position: absolute; inset: 0; overflow: hidden; color: var(--r-ink); }
.slot { position: relative; overflow: hidden; flex: none; background: var(--r-bg); }
.spread.fxl .slot:not(.blank) { box-shadow: var(--shadow); }
.stage.edge .spread.fxl .slot { box-shadow: none; }
.slot.blank { background: transparent; }
.slot > div { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.fold {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 72px; transform: translateX(-50%); pointer-events: none; z-index: 1;
  background: linear-gradient(90deg, transparent, rgb(0 0 0 / .05) 40%, rgb(0 0 0 / .13) 50%, rgb(0 0 0 / .05) 60%, transparent);
}
.loading {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
  color: var(--muted); font-size: 13px; letter-spacing: .04em;
}

/* ---------- 바 ---------- */
.bar {
  position: fixed; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; gap: 4px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
  transition: transform .22s ease, opacity .22s ease;
}
.bar.top { top: 0; padding-top: env(safe-area-inset-top, 0px); height: calc(54px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); }
.bar.bottom { bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); height: calc(58px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
body:not(.ui) .bar.top { transform: translateY(-100%); opacity: 0; pointer-events: none; }
body:not(.ui) .bar.bottom { transform: translateY(100%); opacity: 0; pointer-events: none; }
.ib {
  width: 40px; height: 40px; flex: none; border: 0; border-radius: 10px; background: transparent;
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
}
.ib:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.ib:disabled { opacity: .3; cursor: default; }
.ib svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ib.aa { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
.title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.3; padding: 0 6px; }
.title strong, .title span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title strong { font-weight: 600; font-size: 14px; }
.title span { font-size: 12px; color: var(--muted); }
.bar.bottom .row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 820px; margin: 0 auto; }
#slider { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
.pos { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 4.5em; text-align: center; }

.zoom-pill {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 21;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
  padding: 4px 4px 4px 14px; font-variant-numeric: tabular-nums; font-size: 13px;
}
body.ui .zoom-pill { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
.zoom-pill button { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 500; }

/* ---------- 패널 ---------- */
.scrim { position: fixed; inset: 0; z-index: 29; background: rgb(0 0 0 / .3); }
.drawer {
  position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(360px, 88vw);
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px);
}
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 20px; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.toc { overflow: auto; flex: 1; padding: 4px 0 24px; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc ol ol { padding-left: 14px; }
.toc a { display: block; padding: 9px 20px; color: var(--ink); text-decoration: none; border-radius: 0; }
.toc a:hover { color: var(--accent); }
.toc a.current { color: var(--accent); font-weight: 600; }

.sheet {
  position: fixed; z-index: 30;
  top: calc(env(safe-area-inset-top, 0px) + 60px); right: max(16px, env(safe-area-inset-right, 0px));
  width: min(340px, calc(100vw - 32px)); max-height: calc(100% - 80px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 18px; display: grid; gap: 18px;
}
@media (max-width: 600px) {
  .sheet {
    top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 80%;
    border-radius: 16px 16px 0 0; border-width: 1px 0 0;
    padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
}
.field { display: grid; gap: 8px; }
.field > span { font-size: 12px; color: var(--muted); }
.seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button {
  flex: 1; border: 0; border-radius: 7px; background: transparent; padding: 7px 4px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.25;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.seg button:disabled { opacity: .35; cursor: default; }
.seg .pp { font-variant-numeric: tabular-nums; letter-spacing: .08em; font-size: 13px; }
.seg small { font-size: 11px; color: var(--muted); font-weight: 400; }
.stepper { display: flex; align-items: center; background: var(--bg); border-radius: 9px; padding: 3px; }
.stepper button { border: 0; background: transparent; width: 52px; height: 34px; border-radius: 7px; cursor: pointer; font-family: var(--font-display); font-weight: 800; }
.stepper button:hover { background: var(--surface); }
.stepper .s { font-size: 13px; }
.stepper .l { font-size: 19px; }
.stepper output { flex: 1; text-align: center; font-variant-numeric: tabular-nums; }
.themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.themes button {
  border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer;
  padding: 6px 4px 7px; display: grid; justify-items: center; gap: 5px; font-size: 12px; color: var(--ink);
}
.themes button i {
  width: 100%; height: 30px; border-radius: 6px; border: 1px solid rgb(0 0 0 / .12);
  display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-weight: 800; font-size: 14px;
}
.themes button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--accent); font-weight: 600; }
.th-auto i { background: linear-gradient(135deg, #fdfdfb 50%, #1a1d1c 50%); color: #8a8f8d; }
.th-paper i { background: #fdfdfb; color: #1a1f1e; }
.th-sepia i { background: #f4ebda; color: #3a2f23; }
.th-night i { background: #1a1d1c; color: #d4dad7; }
.theme-quick { position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
details.fonts summary { cursor: pointer; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; list-style: none; }
details.fonts summary::-webkit-details-marker { display: none; }
details.fonts summary b { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.font-row { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.font-row .name { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.font-row .name strong { font-weight: 500; overflow-wrap: anywhere; }
.font-row .st { font-size: 11.5px; white-space: nowrap; }
.font-row .st.ok { color: #23774a; }
.font-row .st.bad { color: #b3261e; }
.font-row .specimen { font-size: 19px; line-height: 1.35; overflow-wrap: anywhere; }
.font-row .meta { font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.named { font-size: 12px; color: var(--muted); padding-top: 10px; overflow-wrap: anywhere; }

.toast {
  position: fixed; z-index: 50; left: 50%; transform: translateX(-50%);
  top: calc(70px + env(safe-area-inset-top, 0px));
  max-width: calc(100vw - 32px); width: max-content;
  background: var(--ink); color: var(--surface); border-radius: 10px; padding: 9px 16px; font-size: 13px;
}
.dropcover {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  border: 3px dashed var(--accent); color: var(--accent); font-size: 18px; font-weight: 600; pointer-events: none;
}
@media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
</style>

<main class="landing" id="landing">

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ================= ZIP ================= */
function readZipDirectory(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);

/* ================= 상태 & 설정 ================= */
const stage = $('#stage'), zoomwrap = $('#zoomwrap'), spreadEl = $('#spread');
const state = { book: null, idx: 0, ids: [], view: 0, views: 1, pages: 1, z: 1, sw: 0, sh: 0, geo: null, cur: null, token: 0 };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

const settings = Object.assign({ scale: 1, read: 'auto', pubFonts: true, spread: 'auto', order: 'even' }, store.get('panmyeon:settings', {}));
const isDarkUi = () => {

};
const effectiveRead = () => settings.read === 'auto' ? (isDarkUi() ? 'night' : 'auto') : settings.read;

function stageBox() { return { w: stage.clientWidth, h: stage.clientHeight }; }
function perView() {

}
function setSpreadSize(w, h) {

  spreadEl.style.height = h + 'px';

}
async function withLoading(p) {

}
function addFold() {

/* ================= 흐르는 본문: 다단으로 쪽 나누기 ================= */
async function showReflow(idx, opts = {}) {
  const token = ++state.token;
  const ch = await withLoading(getChapter(idx));
  if (token !== state.token) return;
  state.idx = idx;
  resetZoom();
  spreadEl.className = 'spread paper';
  const host = document.createElement('div');
  host.id = 'flow';
  host.dataset.path = ch.path;
  spreadEl.replaceChildren(host);
  const root = host.attachShadow({ mode: 'open' });
  const cols = document.createElement('div'); cols.className = 'x-cols';
  const blank = document.createElement('div'); blank.className = 'x-blank';
  const end = document.createElement('div'); end.className = 'x-end';

  root.appendChild(cols);
  root.addEventListener('click', onBookLink);
  state.cur = { ch, root, cols, blank, end };
  applySheets();
  layoutReflow();

function layoutReflow() {

  const edge = SW < 600;
  const o = edge ? 0 : Math.round(Math.max(16, Math.min(36, SH * 0.04)));

  const cs = c.cols.style;

  cs.height = (H - 2 * padY) + 'px';
  cs.margin = `${padY}px ${padX}px`;
  cs.columnWidth = (W - 2 * padX) + 'px';
  cs.columnGap = (2 * padX) + 'px';

/* ================= 고정 레이아웃: 쪽마다 판형 그대로 ================= */
function fxlIds(p) {
  if (perView() === 1) return [p];
  const off = settings.order === 'even' ? 1 : 0;
  const s = Math.floor((p + off) / 2);
  return [2 * s - off, 2 * s - off + 1];
}
async function showFxl(p) {
  const token = ++state.token;
  const book = state.book;
  const ids = fxlIds(Math.max(0, Math.min(len() - 1, p)));
  const chs = await withLoading(Promise.all(ids.map(i => i >= 0 && i < len() ? getChapter(i) : null)));
  if (token !== state.token) return;
  state.ids = ids.filter(i => i >= 0 && i < len());
  state.idx = state.ids[0];
  state.cur = null;
  resetZoom();
  const { w: SW, h: SH } = stageBox();
  const edge = SW < 600;
  const o = edge ? 0 : 16;
  const base = (chs.find(c => c && c.vp) || {}).vp || { w: 800, h: 1200 };
  const sizes = chs.map(c => (c && c.vp) || base);
  const totalW = sizes.reduce((s, v) => s + v.w, 0);
  const maxH = Math.max(...sizes.map(v => v.h));

    slot.style.height = v.h * sc + 'px';

      host.dataset.path = c.path;
      host.style.width = v.w + 'px';
      host.style.height = v.h + 'px';

/* ================= 이동 ================= */
function next() {

/* ================= 화면 정보 ================= */

function buildToc() {

/* ================= 확대 ================= */
function applyZoom() {
  const z = state.z;

  zoomwrap.style.height = state.sh * z + 'px';
  spreadEl.style.transform = z === 1 ? '' : `scale(${z})`;
  stage.classList.toggle('zoomed', z > 1);

}
function setZoom(z, cx, cy) {

  const old = state.z;

  const r = stage.getBoundingClientRect();
  if (cx == null) { cx = r.width / 2; cy = r.height / 2; }
  const w0 = zoomwrap.getBoundingClientRect();
  const px = (r.left + cx - w0.left) / old, py = (r.top + cy - w0.top) / old;
  state.z = z;

/* ================= 손가락·마우스 ================= */
const pointers = new Map();

    gesture = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), z0: state.z, mx: (a.x + b.x) / 2 - r.left, my: (a.y + b.y) / 2 - r.top };

  if (Math.abs(wheelAcc) > 40 && now - lastWheelTurn > 380) {
    wheelAcc > 0 ? next() : prev();
    wheelAcc = 0;
    lastWheelTurn = now;
  }
}, { passive: false });

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input[type=range], input[type=checkbox], select, textarea')) {
    if (e.key !== 'Escape') return;
  }
  if (e.key === 'Escape') { if (anyPanel()) closePanels(); else if (state.z > 1) resetZoom(); return; }
  if (!state.book || e.altKey || e.metaKey) return;
  if (e.ctrlKey) {
    if (e.key === '=' || e.key === '+') { e.preventDefault(); setZoom(state.z * 1.25); }
    else if (e.key === '-') { e.preventDefault(); setZoom(state.z / 1.25); }
    else if (e.key === '0') { e.preventDefault(); resetZoom(); }
    return;
  }
  if (e.key === 'ArrowRight') turn('right');
  else if (e.key === 'ArrowLeft') turn('left');
  else if (e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); next(); }
  else if (e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); prev(); }
  else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  else return;
});

async function toggleFullscreen() {
  const de = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
  try {
    if (de.requestFullscreen) { await de.requestFullscreen({ navigationUI: 'hide' }); closePanels(); document.body.classList.remove('ui'); return; }
    if (de.webkitRequestFullscreen) { de.webkitRequestFullscreen(); return; }

  closePanels();
  document.body.classList.remove('ui');
  toast('전체 화면을 쓸 수 없는 환경이라 메뉴만 숨겼습니다. 가운데를 누르면 다시 보입니다.');

/* ================= 샘플 책 (메모리에서 만든 EPUB) ================= */
function crc32(u8) {
  let c, crc = 0xffffffff;
  for (let i = 0; i < u8.length; i++) {
    c = (crc ^ u8[i]) & 0xff;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xffffffff) >>> 0;
}
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let off = 0;
  for (const [name, text] of files) {
    const n = enc.encode(name), d = enc.encode(text), crc = crc32(d);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true);
    h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, n.length, true);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x800, true);
    c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true); c.setUint16(28, n.length, true); c.setUint32(42, off, true);
    parts.push(new Uint8Array(h.buffer), n, d);
    central.push(new Uint8Array(c.buffer), n);
    off += 30 + n.length + d.length;
  }
  const cdSize = central.reduce((s, a) => s + a.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)]).arrayBuffer();
}
